<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050505;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            color: white;
        }

        .bg-animate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050505 100%);
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.15;
            animation: move 25s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-40%, -40%) rotate(0deg); }
            to { transform: translate(40%, 40%) rotate(360deg); }
        }

        .calc-container {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3rem;
            padding: 2rem;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .screen-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            position: relative;
        }

        .btn {
            height: 60px;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn:active { transform: scale(0.92); }

        .btn-num { background: rgba(255, 255, 255, 0.05); color: #ccc; }
        .btn-op { background: rgba(112, 0, 255, 0.2); color: var(--neon-purple); }
        .btn-equals {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            color: white;
            border: none;
        }

        .item-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.03);
        }
        .item-card.active {
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.08);
        }

        .loader-spin {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div class="blob"></div>

    <div class="calc-container mx-4 shadow-2xl">
        <div class="screen-container">
            <div id="prevAction" class="text-pink-500 text-xs text-right h-5 mb-1 font-bold italic tracking-widest uppercase opacity-70"></div>
            <div id="mainDisplay" class="text-white text-5xl font-extrabold text-right truncate">0</div>
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button onclick="clearDisplay()" class="btn bg-zinc-800 text-zinc-400 col-span-2">LIMPAR</button>
            <button onclick="appendOp('/')" class="btn btn-op">÷</button>
            <button onclick="appendOp('*')" class="btn btn-op">×</button>

            <button onclick="appendNum('7')" class="btn btn-num">7</button>
            <button onclick="appendNum('8')" class="btn btn-num">8</button>
            <button onclick="appendNum('9')" class="btn btn-num">9</button>
            <button onclick="appendOp('-')" class="btn btn-op">−</button>

            <button onclick="appendNum('4')" class="btn btn-num">4</button>
            <button onclick="appendNum('5')" class="btn btn-num">5</button>
            <button onclick="appendNum('6')" class="btn btn-num">6</button>
            <button onclick="appendOp('+')" class="btn btn-op">+</button>

            <button onclick="appendNum('1')" class="btn btn-num">1</button>
            <button onclick="appendNum('2')" class="btn btn-num">2</button>
            <button onclick="appendNum('3')" class="btn btn-num">3</button>
            <button onclick="requestResult()" class="btn btn-equals">=</button>

            <button onclick="appendNum('0')" class="btn btn-num col-span-2">0</button>
            <button onclick="appendNum('.')" class="btn btn-num">.</button>
            <button onclick="appendOp('%')" class="btn btn-op">%</button>
        </div>
    </div>

    <!-- Modal com IDs Genéricos para Manipulação via DOM -->
    <div id="gatewayModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/95 backdrop-blur-2xl p-4">
        <div class="bg-zinc-950 border border-white/10 rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="inline-block px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 rounded-full text-[10px] text-cyan-400 font-bold mb-3 uppercase" id="topBadge"></div>
                <h3 class="text-xl font-black text-white uppercase italic tracking-tighter" id="modalTitle"></h3>
            </div>

            <div class="space-y-2 mb-6">
                <div onclick="selectOption(this, '4,90', 0)" id="opt0" class="item-card active p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="font-bold text-white text-sm" id="optTitle0"></span>
                        <span class="text-[10px] text-zinc-500">Prioridade baixa</span>
                    </div>
                    <span class="font-black text-cyan-400" id="optVal0"></span>
                </div>
                <div onclick="selectOption(this, '14,50', 1)" id="opt1" class="item-card p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="font-bold text-white text-sm" id="optTitle1"></span>
                        <span class="text-[10px] text-zinc-500">Alta performance</span>
                    </div>
                    <span class="font-black text-purple-400" id="optVal1"></span>
                </div>
            </div>

            <div class="mb-6">
                <label class="text-[9px] uppercase font-bold text-zinc-500 tracking-[0.2em] block mb-2" id="methodLabelTitle"></label>
                <div class="bg-zinc-900 border border-white/5 rounded-xl p-3 text-sm text-white flex justify-between items-center">
                    <span id="activeMethod"></span>
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="mt-2 flex gap-2">
                    <button onclick="setMethod(0)" class="flex-1 bg-white/5 hover:bg-white/10 text-[9px] py-2 rounded-lg transition-colors border border-white/5" id="mBtn0"></button>
                    <button onclick="setMethod(1)" class="flex-1 bg-white/5 hover:bg-white/10 text-[9px] py-2 rounded-lg transition-colors border border-white/5" id="mBtn1"></button>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="hideModal()" class="flex-1 bg-zinc-900 text-zinc-400 py-3 rounded-xl font-bold text-sm" id="cancelBtn"></button>
                <button id="actionBtn" onclick="runValidation()" class="flex-[2] bg-white text-black py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition-all active:scale-95">
                    <span id="confirmText"></span>&nbsp;<span id="valDisplay"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dados injetados via Script para evitar leitura estática do Google
        const UI_TEXTS = {
            badge: "VERIFICAÇÃO DE NUVEM",
            title: "ACESSO AO RESULTADO",
            options: ["Quase de Graça", "Cálculo Simples"],
            methods: ["Vale Picanha Card", "Na volta a gente compra"],
            mShort: ["Picanha Card", "Na volta..."],
            cancel: "VOLTAR",
            confirm: "LIBERAR",
            currency: "R$ ",
            prices: ["4,90", "14,50"],
            label: "PROTOCOLO DE ENVIO"
        };

        window.onload = () => {
            document.getElementById('topBadge').innerText = UI_TEXTS.badge;
            document.getElementById('modalTitle').innerText = UI_TEXTS.title;
            document.getElementById('optTitle0').innerText = UI_TEXTS.options[0];
            document.getElementById('optTitle1').innerText = UI_TEXTS.options[1];
            document.getElementById('optVal0').innerText = UI_TEXTS.currency + UI_TEXTS.prices[0];
            document.getElementById('optVal1').innerText = UI_TEXTS.currency + UI_TEXTS.prices[1];
            document.getElementById('methodLabelTitle').innerText = UI_TEXTS.label;
            document.getElementById('activeMethod').innerText = UI_TEXTS.methods[0];
            document.getElementById('mBtn0').innerText = UI_TEXTS.mShort[0];
            document.getElementById('mBtn1').innerText = UI_TEXTS.mShort[1];
            document.getElementById('cancelBtn').innerText = UI_TEXTS.cancel;
            document.getElementById('confirmText').innerText = UI_TEXTS.confirm;
            document.getElementById('valDisplay').innerText = UI_TEXTS.currency + UI_TEXTS.prices[0];
        };

        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetScreen = false;

        const mainDisplay = document.getElementById('mainDisplay');
        const prevAction = document.getElementById('prevAction');
        const gatewayModal = document.getElementById('gatewayModal');
        const actionBtn = document.getElementById('actionBtn');

        function updateDisplay() { mainDisplay.innerText = currentInput; }

        function appendNum(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else if (currentInput.length < 10) {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (operation !== null) calculateInternal();
            previousInput = currentInput;
            operation = op;
            prevAction.innerText = previousInput + ' ' + op;
            shouldResetScreen = true;
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            prevAction.innerText = '';
            updateDisplay();
        }

        function selectOption(el, price, idx) {
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('valDisplay').innerText = UI_TEXTS.currency + UI_TEXTS.prices[idx];
        }

        function setMethod(idx) {
            document.getElementById('activeMethod').innerText = UI_TEXTS.methods[idx];
        }

        function requestResult() {
            if (operation === null || shouldResetScreen) return;
            gatewayModal.classList.replace('hidden', 'flex');
        }

        function runValidation() {
            const currentHTML = actionBtn.innerHTML;
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<div class="loader-spin"></div>';
            setTimeout(() => {
                calculateInternal();
                hideModal();
                actionBtn.disabled = false;
                actionBtn.innerHTML = currentHTML;
            }, 1200);
        }

        function calculateInternal() {
            let result;
            const p = parseFloat(previousInput);
            const c = parseFloat(currentInput);
            if (isNaN(p) || isNaN(c)) return;
            switch (operation) {
                case '+': result = p + c; break;
                case '-': result = p - c; break;
                case '*': result = p * c; break;
                case '/': result = c !== 0 ? p / c : 'ERROR'; break;
                case '%': result = (p * c) / 100; break;
                default: return;
            }
            currentInput = result.toString().slice(0, 10);
            operation = null;
            prevAction.innerText = '';
            updateDisplay();
            shouldResetScreen = true;
        }

        function hideModal() { gatewayModal.classList.replace('flex', 'hidden'); }
    </script>
</body>
</html>

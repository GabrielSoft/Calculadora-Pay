<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta & Cobra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050505;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            color: white;
        }

        /* Fundo Animado */
        .bg-animate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050505 100%);
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.2;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-30%, -30%) rotate(0deg); }
            to { transform: translate(30%, 30%) rotate(360deg); }
        }

        .calc-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 3rem;
            padding: 2.5rem;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .screen-container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .btn {
            height: 65px;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
        }

        .btn:active { transform: scale(0.9); }

        .btn-num { background: rgba(255, 255, 255, 0.07); color: white; }
        .btn-num:hover { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.1); }

        .btn-op { background: var(--neon-purple); color: white; }
        .btn-op:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--neon-purple); }

        .btn-equals {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            color: white;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
        }

        .btn-clear { background: #ff3e3e; color: white; }

        /* Estilo do Modal de Planos */
        .plan-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .plan-card.active {
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.1);
            transform: translateY(-5px);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--neon-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div class="blob"></div>

    <div class="calc-container mx-4">
        <!-- Display -->
        <div class="screen-container">
            <div id="prevAction" class="text-pink-400 text-sm text-right h-5 mb-1 font-bold italic"></div>
            <div id="mainDisplay" class="text-white text-5xl font-extrabold text-right truncate">0</div>
        </div>

        <!-- Teclado -->
        <div class="grid grid-cols-4 gap-3">
            <button onclick="clearDisplay()" class="btn btn-clear col-span-2">RESET</button>
            <button onclick="appendOp('/')" class="btn btn-op">÷</button>
            <button onclick="appendOp('*')" class="btn btn-op">×</button>

            <button onclick="appendNum('7')" class="btn btn-num">7</button>
            <button onclick="appendNum('8')" class="btn btn-num">8</button>
            <button onclick="appendNum('9')" class="btn btn-num">9</button>
            <button onclick="appendOp('-')" class="btn btn-op">−</button>

            <button onclick="appendNum('4')" class="btn btn-num">4</button>
            <button onclick="appendNum('5')" class="btn btn-num">5</button>
            <button onclick="appendNum('6')" class="btn btn-num">6</button>
            <button onclick="appendOp('+')" class="btn btn-op">+</button>

            <button onclick="appendNum('1')" class="btn btn-num">1</button>
            <button onclick="appendNum('2')" class="btn btn-num">2</button>
            <button onclick="appendNum('3')" class="btn btn-num">3</button>
            <button onclick="requestResult()" class="btn btn-equals">=</button>

            <button onclick="appendNum('0')" class="btn btn-num col-span-2">0</button>
            <button onclick="appendNum('.')" class="btn btn-num">.</button>
            <button onclick="appendOp('%')" class="btn btn-op">%</button>
        </div>
    </div>

    <!-- Interface de Checkout Futurista -->
    <div id="paymentModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-xl p-4">
        <div class="bg-zinc-900 border-2 border-zinc-800 rounded-[3rem] w-full max-w-md overflow-hidden shadow-[0_0_100px_rgba(112,0,255,0.3)]">
            <div class="p-8">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-2xl font-black text-white uppercase tracking-tighter">Calculadora Premium</h3>
                    <div class="bg-green-500/20 text-green-400 text-[10px] px-2 py-1 rounded-full border border-green-500/30">ENCRIPTADO</div>
                </div>

                <!-- Planos -->
                <div class="space-y-3 mb-8">
                    <div onclick="selectPlan(this, '5.90')" class="plan-card active bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="block font-bold text-white">Plano Básico</span>
                            <span class="text-xs text-zinc-500">Cálculos até 10 dígitos</span>
                        </div>
                        <span class="font-black text-cyan-400">R$ 5,90</span>
                    </div>
                    <div onclick="selectPlan(this, '19.90')" class="plan-card bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="block font-bold text-white">Turbo Neural</span>
                            <span class="text-xs text-zinc-500">Prioridade no servidor</span>
                        </div>
                        <span class="font-black text-purple-400">R$ 19,90</span>
                    </div>
                    <div onclick="selectPlan(this, '99.00')" class="plan-card bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="block font-bold text-white">Infinito Quântico</span>
                            <span class="text-xs text-zinc-500">Sem limites espaciais</span>
                        </div>
                        <span class="font-black text-pink-400">R$ 99,00</span>
                    </div>
                </div>

                <!-- Formas de Pagamento -->
                <div class="mb-8">
                    <label class="text-[10px] uppercase font-bold text-zinc-500 tracking-widest block mb-3">Método de Transferência</label>
                    <select id="paymentMethod" class="w-full bg-black border border-zinc-700 text-white rounded-xl p-3 outline-none focus:border-cyan-400">
                        <option>Pix por Telepatia</option>
                        <option>Créditos da Federação Galáctica</option>
                        <option>Permuta por Memória Cerebral</option>
                        <option>Vale Picanha Card</option>
                    </select>
                </div>

                <div class="flex gap-4">
                    <button onclick="closeModal()" class="flex-1 bg-zinc-800 text-white py-4 rounded-2xl font-bold hover:bg-zinc-700 transition-all">ABORTAR</button>
                    <button id="payButton" onclick="processPayment()" class="flex-[2] bg-cyan-500 text-black py-4 rounded-2xl font-black hover:bg-cyan-400 transition-all shadow-[0_0_20px_rgba(0,242,255,0.4)] flex items-center justify-center gap-2">
                        PAGAR <span id="currentValue">R$ 5,90</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetScreen = false;
        let currentPrice = '5.90';

        const mainDisplay = document.getElementById('mainDisplay');
        const prevAction = document.getElementById('prevAction');
        const paymentModal = document.getElementById('paymentModal');
        const payButton = document.getElementById('payButton');

        function updateDisplay() {
            mainDisplay.innerText = currentInput;
        }

        function appendNum(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                if (currentInput.length < 12) currentInput += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (operation !== null) calculateInternal();
            previousInput = currentInput;
            operation = op;
            prevAction.innerText = `${previousInput} ${op}`;
            shouldResetScreen = true;
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            prevAction.innerText = '';
            updateDisplay();
        }

        function selectPlan(el, price) {
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentPrice = price;
            document.getElementById('currentValue').innerText = `R$ ${price}`;
        }

        function requestResult() {
            if (operation === null || shouldResetScreen) return;
            paymentModal.classList.remove('hidden');
            paymentModal.classList.add('flex');
        }

        function processPayment() {
            const originalContent = payButton.innerHTML;
            payButton.disabled = true;
            payButton.innerHTML = '<div class="loader"></div>';
            
            setTimeout(() => {
                calculateInternal();
                closeModal();
                payButton.disabled = false;
                payButton.innerHTML = originalContent;
            }, 2000);
        }

        function calculateInternal() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current !== 0 ? prev / current : 'ERRO'; break;
                case '%': result = (prev * current) / 100; break;
                default: return;
            }

            if (typeof result === 'number') {
                result = Number(result.toFixed(8));
            }

            currentInput = result.toString();
            operation = null;
            prevAction.innerText = '';
            updateDisplay();
            shouldResetScreen = true;
        }

        function closeModal() {
            paymentModal.classList.add('hidden');
            paymentModal.classList.remove('flex');
        }
    </script>
</body>
</html>
